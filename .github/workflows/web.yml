name: Web (wasm)

# Publishes the browser build and deploys it to GitHub Pages.
#
# Windows, not Linux: the shader pipeline runs NFMWorld.ShaderCompiler.Task at build time and that
# P/Invokes hardcoded win-x64 shaderc/spirv-cross binaries, so the build host has to be Windows
# until the task grows a Linux branch.

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # libopenmpt needs make and a POSIX toolchain, and its archive must be built with .NET's own
  # Emscripten so it matches the runtime it links into. On Linux that is one job; the Windows
  # build below takes the artifact.
  libopenmpt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      # The script takes the Emscripten it builds with from this workload rather than from a
      # system emsdk, so the version matches what the browser head links with.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Build libopenmpt
        run: |
          mkdir -p out
          ./NFMWorld.Platform.WebGL/native/build-libopenmpt.sh out

      - name: Upload libopenmpt
        uses: actions/upload-artifact@v4
        with:
          name: libopenmpt-wasm
          path: out/libopenmpt.a
          # It is only a build input for the next job; nothing needs the history.
          retention-days: 1

  build:
    needs: libopenmpt
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      # Emscripten, the Mono wasm runtime pack and the AOT cross compiler all come from this
      # workload; without it the browser build produces no _framework directory at all.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      # NFMWorld.Browser.csproj links this archive by path, and it is no longer checked in.
      - name: Download libopenmpt
        uses: actions/download-artifact@v4
        with:
          name: libopenmpt-wasm
          path: NFMWorld.Platform.WebGL/native

      - name: Publish
        shell: bash
        # NfmwBrowser gates the Lua compiler features the Mono wasm runtime needs, and the project
        # fails the build without it. AOT stays off: mono-aot-cross crashes on this assembly set
        # in the .NET 11 RC (see the comment in NFMWorld.Browser.csproj).
        run: |
          dotnet publish NFMWorld.Browser/NFMWorld.Browser.csproj \
            -c Release \
            -p:NfmwBrowser=true

      # Pages serves a directory, and the SDK's publish output nests it under publish/wwwroot.
      - name: Collect site
        shell: bash
        run: |
          mkdir -p site
          cp -r NFMWorld.Browser/bin/Release/net11.0/publish/wwwroot/. site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
