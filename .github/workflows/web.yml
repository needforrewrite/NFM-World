name: Deploy FNA Sample

on:
  push:
    branches:
      - main
      - feature/web
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        variant: [Release]
        dotnet-version: ['10.0.x']
        dotnet-version-id: ['net10.0']
    runs-on: ${{ matrix.os }}
    name: Build FNA Sample
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install wine and dependencies
        run: |
          # Remove ppa:ondrej/php since it breaks i386 packages -- https://github.com/oerdnj/deb.sury.org/issues/1745
          sudo add-apt-repository ppa:ondrej/php
          sudo apt-get install --yes ppa-purge
          sudo ppa-purge -y ppa:ondrej/php
          
          sudo dpkg --add-architecture i386
          wget -qO - https://dl.winehq.org/wine-builds/winehq.key | sudo apt-key add -
          sudo add-apt-repository ppa:cybermax-dexter/sdl2-backport
          sudo apt-add-repository "deb https://dl.winehq.org/wine-builds/ubuntu $(lsb_release -cs) main"
          sudo apt install --install-recommends winehq-stable winetricks xvfb

      - name: Setup Wine prefix for MGFXC
        run: |
          # Start Xvfb for headless Wine operation
          Xvfb :99 -screen 0 1024x768x16 &
          XVFB_PID=$!
          export DISPLAY=:99
          
          # Wait for Xvfb to be ready
          sleep 2
          
          # Ensure Xvfb is cleaned up on exit
          trap "kill $XVFB_PID 2>/dev/null || true" EXIT
          
          # Create 64-bit wine prefix
          export WINEPREFIX=$HOME/.wine64
          export WINEARCH=win64
          export WINEDLLOVERRIDES="mscoree,mshtml="
          
          # Initialize wine prefix
          wineboot -u
          
          # Wait for wine server to start (with timeout)
          for i in {1..30}; do
            if wineserver -w 2>/dev/null; then
              break
            fi
            sleep 1
          done
          
          # Install d3dcompiler_47 using winetricks
          WINEPREFIX=$HOME/.wine64 DISPLAY=:99 winetricks -q d3dcompiler_47
          
          # Set environment variable for MGFXC
          echo "MGFXC_WINE_PATH=$HOME/.wine64" >> $GITHUB_ENV
          echo "WINEPREFIX=$HOME/.wine64" >> $GITHUB_ENV

      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          
      - name: Install dotnet workloads
        run: |
          dotnet workload install wasm-tools
          dotnet workload install wasm-experimental
          dotnet tool install -g uno.check
          uno-check -v --target web --ci --non-interactive
        working-directory: ${{ github.workspace }}/NFMWorld.Web

      - name: Install MGFXC
        run: dotnet tool install -g dotnet-mgfxc

      - name: Generate version string
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          DATE=$(date -u +"%Y.%m.%d")
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          SEMANTIC_VERSION="1.0.0"
          INFO_VERSION="NFM-World ${BRANCH_NAME}-${DATE}-${SHORT_SHA}"
          echo "semantic_version=${SEMANTIC_VERSION}" >> $GITHUB_OUTPUT
          echo "info_version=${INFO_VERSION}" >> $GITHUB_OUTPUT

      - name: Install cross-compilation dependencies
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          # Install ARM64 cross-compilation toolchain
          sudo apt-get install -y clang zlib1g-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Publish project
        run: |
          dotnet publish NFMWorld.Web -c Release \
            -p:Version="${{ steps.version.outputs.semantic_version }}" \
            -p:InformationalVersion="${{ steps.version.outputs.info_version }}" \
            -o ./publish/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfm-world-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/

      - name: Test path
        run: |
          cd ${{ github.workspace }}/publish
          cd wwwroot
          ls

      - name: Save published files for download
        uses: actions/upload-artifact@v4
        with:
          name: Published Files
          path: |
            ${{ github.workspace }}/publish/wwwroot/*
          if-no-files-found: error

      - name: Fix permissions
        run: |
          chmod -c -R +rX "${{ github.workspace }}/publish/wwwroot/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Save published files for GH Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ${{ github.workspace }}/publish/wwwroot/
  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest]
        variant: [Release]
    runs-on: ${{ matrix.os }}
    needs: build
    #required for Github Pages deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy FNA Sample
    steps:
      - name: Deploy to Github Pages
        uses: actions/deploy-pages@v4