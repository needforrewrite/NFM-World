name: Web (wasm)

# Publishes the browser build and deploys it to GitHub Pages.
#
# Windows, not Linux: the shader pipeline runs NFMWorld.ShaderCompiler.Task at build time and that
# P/Invokes hardcoded win-x64 shaderc/spirv-cross binaries, so the build host has to be Windows
# until the task grows a Linux branch.
#
# To reproduce the libopenmpt job locally before pushing, run it with act against a copy of this
# tree rather than the tree itself: act copies the whole checkout into the container, and with
# bin/, obj/ and the submodules that is tens of GB.
#
#   mkdir /tmp/act && cp --parents .github/workflows/web.yml \
#       NFMWorld.Platform.WebGL/native/build-libopenmpt.sh /tmp/act/ \
#     && cd /tmp/act && git init -q && git add -A \
#     && git -c user.email=a@b -c user.name=c commit -qm init
#   act -j libopenmpt -P ubuntu-latest=catthehacker/ubuntu:act-latest
#
# It runs the job through to "==> wrote .../libopenmpt.a"; the upload step then fails with
# "Unable to get the ACTIONS_RUNTIME_TOKEN", which is act's own limitation and not the build.

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # libopenmpt needs make and a POSIX toolchain, and its archive must be built with .NET's own
  # Emscripten so it matches the runtime it links into. On Linux that is one job; the Windows
  # build below takes the artifact.
  libopenmpt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The nightly SDK, not the GA one: the head is net12.0/CoreCLR and its Emscripten packs come
      # from this workload. The version is pinned because 12.0.1xx is a nightly channel that moves
      # daily; bump it together with the one in the build job below.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '12.0.100-alpha.1.26571.109'

      # The script takes the Emscripten it builds with from this workload rather than from a
      # system emsdk, so the version matches what the browser head links with.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      # Through bash rather than executed directly: the script's executable bit is a mode bit in
      # git, which a Windows checkout can drop, and losing it fails here as a bare exit code 126
      # ("Permission denied") that says nothing about the cause. Naming the interpreter costs one
      # word and stops the build depending on that bit surviving a round trip.
      - name: Build libopenmpt
        run: |
          mkdir -p out
          bash NFMWorld.Platform.WebGL/native/build-libopenmpt.sh out

      - name: Upload libopenmpt
        uses: actions/upload-artifact@v4
        with:
          name: libopenmpt-wasm
          path: out/libopenmpt.a
          # It is only a build input for the next job; nothing needs the history.
          retention-days: 1

  build:
    needs: libopenmpt
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # The same nightly pin as the libopenmpt job, and for the same reason.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '12.0.100-alpha.1.26571.109'

      # Emscripten, the CoreCLR wasm runtime pack and the ReadyToRun cross-compiler all come from
      # this workload; without it the browser build produces no _framework directory at all.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      # NFMWorld.Browser.csproj links this archive by path, and it is no longer checked in.
      - name: Download libopenmpt
        uses: actions/download-artifact@v4
        with:
          name: libopenmpt-wasm
          path: NFMWorld.Platform.WebGL/native

      - name: Publish
        shell: bash
        # NfmwBrowser gates the browser-only references (the desktop ImGui binding would not link)
        # and the project fails the build without it. ReadyToRun is a project property here, so the
        # publish needs no AOT switch.
        run: |
          dotnet publish NFMWorld.Browser/NFMWorld.Browser.csproj \
            -c Release \
            -p:NfmwBrowser=true

      # Pages serves a directory, and the SDK's publish output nests it under publish/wwwroot.
      - name: Collect site
        shell: bash
        run: |
          mkdir -p site
          cp -r NFMWorld.Browser/bin/Release/net12.0/publish/wwwroot/. site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
