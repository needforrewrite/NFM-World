name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      artifacts_only:
        description: Build and upload workflow artifacts without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      tag: ${{ steps.channel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Determine release channel
        id: channel
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
        run: python3 tools/desktop_release.py prepare

  test:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Test
        run: dotnet test NFMWorld.Library.Test/NFMWorld.Library.Test.csproj -c Debug
      - name: Test archive
        run: dotnet test NFMWorld.Archive.Test/NFMWorld.Archive.Test.csproj -c Debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release tooling
        run: python -m unittest discover -s tools -p test_desktop_release.py

  build:
    needs: [prepare, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MGFXC
        if: runner.os == 'Windows'
        run: dotnet tool install -g dotnet-mgfxc
      - name: Check Xcode command-line tools
        if: runner.os == 'macOS'
        run: xcode-select -p && clang --version
      - name: Build and package ${{ matrix.rid }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          args=()
          if [[ "$CHANNEL" == stable ]]; then args+=("--stable-tag=$TAG"); fi
          python tools/desktop_release.py build --rid "$RID" --ref="$BUILD_REF" --sha "$BUILD_SHA" --output artifacts "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: nfm-world-${{ matrix.rid }}
          path: artifacts/nfm-world-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release-dev:
    needs: [prepare, test, build]
    # The publisher requires both core assets but tolerates unavailable macOS runners.
    if: ${{ !cancelled() && !inputs.artifacts_only && needs.test.result == 'success' && needs.prepare.outputs.channel == 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/nfmw-assets
          pattern: nfm-world-*
          merge-multiple: true
      - name: Publish development snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tools/desktop_release.py publish --channel dev --tag "$TAG" --sha "$BUILD_SHA" --ref="$BUILD_REF" --assets "$RUNNER_TEMP/nfmw-assets"

  release-stable:
    needs: [prepare, test, build]
    if: ${{ !inputs.artifacts_only && needs.prepare.outputs.channel == 'stable' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: nfmworld-stable-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/nfmw-assets
          pattern: nfm-world-*
          merge-multiple: true
      - name: Publish stable release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tools/desktop_release.py publish --channel stable --tag "$TAG" --sha "$BUILD_SHA" --ref="$BUILD_REF" --assets "$RUNNER_TEMP/nfmw-assets"
      - name: Announce stable release in Discord
        if: steps.publish.outputs.published == 'true'
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: python3 tools/desktop_release.py announce --release-json "$RUNNER_TEMP/nfmw-release/release.json" --notes "$RUNNER_TEMP/nfmw-release/commits.txt"
