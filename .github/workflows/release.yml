name: Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
      is_master: ${{ steps.check_branch.outputs.is_master }}
      branch_name: ${{ steps.branch.outputs.branch_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Extract branch name
        id: branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Check if master branch
        id: check_branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "is_master=true" >> $GITHUB_OUTPUT
          else
            echo "is_master=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate tag name
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          DATETIME=$(date -u +"%Y%m%dT%H%M%SZ")
          TAG_NAME="release-${DATETIME}-${SHORT_SHA}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        # if: steps.check_branch.outputs.is_master == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists, skipping tag creation"
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        rid:
          - win-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Generate version string
        id: version
        shell: bash
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          DATE=$(date -u +"%Y.%m.%d")
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          SEMANTIC_VERSION="1.0.0"
          INFO_VERSION="NFM-World ${BRANCH_NAME}-${DATE}-${SHORT_SHA}"
          echo "semantic_version=${SEMANTIC_VERSION}" >> $GITHUB_OUTPUT
          echo "info_version=${INFO_VERSION}" >> $GITHUB_OUTPUT

      - name: Publish ${{ matrix.rid }}
        run: |
          # Use /maxcpucount:1 to prevent a parallel-build race condition where MSBuild worker nodes
          # simultaneously write NFMWorld.CrashReporter.runtimeconfig.json (diamond dependency via
          # NFMWorld.Multiplayer.Base -> NFMWorld.Library -> NFMWorld.CrashReporter).
          dotnet publish NFMWorld/NFMWorld.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            -p:Version="${{ steps.version.outputs.semantic_version }}" `
            -p:InformationalVersion="${{ steps.version.outputs.info_version }}" `
            -o ./publish/${{ matrix.rid }} `
            -p:SelfContained=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:IncludeAllContentForSelfExtract=false `
            -p:ErrorOnDuplicatePublishOutputFiles=false `
            -- /maxcpucount:1

      - name: Publish NFMWorld.Library native DLL (${{ matrix.rid }})
        shell: bash
        run: |
          set -e
          dotnet publish NFMWorld.Library/NFMWorld.Library.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            -o "./publish/${{ matrix.rid }}/native" \
            -- /maxcpucount:1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfm-world-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid:
          - linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Generate version string
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          DATE=$(date -u +"%Y.%m.%d")
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          SEMANTIC_VERSION="1.0.0"
          INFO_VERSION="NFM-World ${BRANCH_NAME}-${DATE}-${SHORT_SHA}"
          echo "semantic_version=${SEMANTIC_VERSION}" >> $GITHUB_OUTPUT
          echo "info_version=${INFO_VERSION}" >> $GITHUB_OUTPUT

      - name: Publish ${{ matrix.rid }}
        run: |
          # Use /maxcpucount:1 to prevent a parallel-build race condition where MSBuild worker nodes
          # simultaneously write NFMWorld.CrashReporter.runtimeconfig.json (diamond dependency via
          # NFMWorld.Multiplayer.Base -> NFMWorld.Library -> NFMWorld.CrashReporter).
          dotnet publish NFMWorld/NFMWorld.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Version="${{ steps.version.outputs.semantic_version }}" \
            -p:InformationalVersion="${{ steps.version.outputs.info_version }}" \
            -o ./publish/${{ matrix.rid }} \
            -p:SelfContained=true \
            -p:PublishReadyToRun=true \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -p:IncludeAllContentForSelfExtract=false \
            -p:ErrorOnDuplicatePublishOutputFiles=false \
            -- /maxcpucount:1

      - name: Publish NFMWorld.Library native library (${{ matrix.rid }})
        run: |
          set -e
          dotnet publish NFMWorld.Library/NFMWorld.Library.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            -o "./publish/${{ matrix.rid }}/native" \
            -- /maxcpucount:1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfm-world-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/

  build-macos:
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Command Line Tools for Xcode
        run: |
          # Install Xcode Command Line Tools (required for NativeAOT)
          # GitHub Actions runners typically have these pre-installed
          # Verify they are available
          if xcode-select -p &>/dev/null; then
            echo "Command Line Tools already installed at: $(xcode-select -p)"
          else
            echo "Command Line Tools not found. They should be pre-installed on GitHub Actions runners."
            echo "Installing manually may not work in CI environment."
            exit 1
          fi
          
          # Verify clang is available
          clang --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Generate version string
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          DATE=$(date -u +"%Y.%m.%d")
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          SEMANTIC_VERSION="1.0.0"
          INFO_VERSION="NFM-World ${BRANCH_NAME}-${DATE}-${SHORT_SHA}"
          echo "semantic_version=${SEMANTIC_VERSION}" >> $GITHUB_OUTPUT
          echo "info_version=${INFO_VERSION}" >> $GITHUB_OUTPUT

      - name: Publish macOS x64 and arm64 binaries
        run: |
          # Build for both architectures separately (NativeAOT doesn't support multi-RID publishing)
          # Use /maxcpucount:1 to prevent a parallel-build race condition where MSBuild worker nodes
          # simultaneously write NFMWorld.CrashReporter.runtimeconfig.json (diamond dependency via
          # NFMWorld.Multiplayer.Base -> NFMWorld.Library -> NFMWorld.CrashReporter).
          for RID in osx-x64 osx-arm64; do
            dotnet publish NFMWorld/NFMWorld.csproj \
              -c Release \
              -r $RID \
              -p:Version="${{ steps.version.outputs.semantic_version }}" \
              -p:InformationalVersion="${{ steps.version.outputs.info_version }}" \
              -o ./publish/$RID \
              -p:SelfContained=true \
              -p:PublishReadyToRun=true \
              -p:IncludeNativeLibrariesForSelfExtract=false \
              -p:IncludeAllContentForSelfExtract=false \
              -p:ErrorOnDuplicatePublishOutputFiles=false \
              -- /maxcpucount:1

            dotnet publish NFMWorld.Library/NFMWorld.Library.csproj \
              -c Release \
              -r "$RID" \
              -o "./publish/$RID/native" \
              -- /maxcpucount:1
          done

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfm-world-osx-x64
          path: ./publish/osx-x64/

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfm-world-osx-arm64
          path: ./publish/osx-arm64/

  release:
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts for release
        run: |
          set -e
          shopt -s nullglob
          cd artifacts
          # Package all artifacts based on platform
          for dir in nfm-world-*; do
            if [ -d "$dir" ]; then
              pushd "$dir" > /dev/null
              # Use zip for Windows, tar.gz for Linux and macOS
              if [[ "$dir" == nfm-world-win-* ]]; then
                zip -r "../${dir}.zip" .
              elif [[ "$dir" == nfm-world-linux-* ]] || [[ "$dir" == nfm-world-osx-* ]]; then
                tar -czf "../${dir}.tar.gz" .
              else
                echo "Warning: Unknown platform for directory: $dir"
              fi
              popd > /dev/null
              rm -rf "$dir"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Build ${{ needs.prepare.outputs.branch_name }} - ${{ needs.prepare.outputs.short_sha }}
          # prerelease: ${{ needs.prepare.outputs.is_master != 'true' }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
