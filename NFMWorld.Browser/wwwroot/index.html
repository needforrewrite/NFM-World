<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFM World</title>
  <!-- There is no icon to serve; without this the browser requests /favicon.ico and logs a 404. -->
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #cfd2dc;
            font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <div id="boot">loading…</div>
  <!-- The boot archive is the largest single download after the runtime, and main.js only
       consumes it once the assembly exports exist. Preloading it here starts the request during
       HTML parse, so it runs alongside the runtime's wasm fetches instead of after them. -->
  <link rel="preload" href="./data.boot.zip" as="fetch" crossorigin>
  <!-- Modules main.js imports. Without these the graph is discovered one hop at a time - main.js
       only after index.html parses, dotnet.js only after main.js parses - and the round trips
       stack up before the first wasm request. audio.js and http.js are `await import()`ed after
       `getAssemblyExports`, which puts them behind the whole runtime load; preloading them here
       moves them to parse time. A modulepreload is reused by the later import, so nothing is
       fetched twice. -->
  <link rel="modulepreload" href="./_framework/dotnet.js">
  <link rel="modulepreload" href="./audio.js">
  <link rel="modulepreload" href="./http.js">
  <script type="module" src="./main.js"></script>
</body>
</html>
